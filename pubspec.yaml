name: cairn
description: "Cairn: a field journal for hikers and backpackers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so the app works offline and printed PDFs use the exact same font
  # files as the screen. Licence: assets/fonts/newsreader/OFL.txt (SIL OFL 1.1).
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader/Newsreader16pt-Regular.ttf
        - asset: assets/fonts/newsreader/Newsreader16pt-Italic.ttf
          style: italic
        - asset: assets/fonts/newsreader/Newsreader16pt-Medium.ttf
          weight: 500
