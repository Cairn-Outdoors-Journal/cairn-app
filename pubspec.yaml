name: cairn
description: "Cairn: a field journal for hikers and backpackers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  sodium: ^4.1.1
  sqlite3: ^3.7.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  # Font licences, shown on the app's licence page (lib/design/font_licences.dart).
  assets:
    - assets/fonts/newsreader/OFL.txt
    - assets/fonts/schibsted-grotesk/OFL.txt
    - assets/fonts/martian-mono/OFL.txt

  # Bundled so the app works offline and printed PDFs use the exact same font
  # files as the screen. All three are SIL OFL 1.1 (ADR 0005): Newsreader for
  # writing, Schibsted Grotesk for the interface, Martian Mono for stamped data.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader/Newsreader16pt-Regular.ttf
        - asset: assets/fonts/newsreader/Newsreader16pt-Italic.ttf
          style: italic
        - asset: assets/fonts/newsreader/Newsreader16pt-Medium.ttf
          weight: 500
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/schibsted-grotesk/SchibstedGrotesk-Regular.ttf
        - asset: assets/fonts/schibsted-grotesk/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/schibsted-grotesk/SchibstedGrotesk-SemiBold.ttf
          weight: 600
    - family: Martian Mono
      fonts:
        - asset: assets/fonts/martian-mono/MartianMono-Regular.ttf
        - asset: assets/fonts/martian-mono/MartianMono-Medium.ttf
          weight: 500

# Native build options. The journal database uses SQLite3MultipleCiphers, an
# SQLite build with encryption (ADR 0010).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
